<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omnia Tria</title>
<meta name="description" content="Cada día, tres cosas que me gustan: películas, frases, historias y lo que vaya saliendo.">
<link rel="icon" href="abeja.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
/* Idea: un cuaderno editorial; cada artículo son tres piezas numeradas 1·2·3 en grande. */
:root {
  --papel: #f3f4ef;
  --tarjeta: #ffffff;
  --tinta: #17191e;
  --tinta-suave: #5a5f6a;
  --linea: #d9dbd3;
  --acento: #2b45c9;
  --acento-suave: #e3e7fa;
  --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --cuerpo: "Source Serif 4", Georgia, "Times New Roman", serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papel: #121419;
    --tarjeta: #1b1e25;
    --tinta: #eceef2;
    --tinta-suave: #a2a8b5;
    --linea: #2c313b;
    --acento: #8ea0ff;
    --acento-suave: #232a47;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --papel: #121419;
  --tarjeta: #1b1e25;
  --tinta: #eceef2;
  --tinta-suave: #a2a8b5;
  --linea: #2c313b;
  --acento: #8ea0ff;
  --acento-suave: #232a47;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--papel);
  color: var(--tinta);
  font-family: var(--cuerpo);
  font-size: 1.125rem;
  line-height: 1.6;
}
a { color: inherit; }
a:focus-visible, button:focus-visible { outline: 3px solid var(--acento); outline-offset: 3px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.1; text-wrap: balance; margin: 0; }

.envoltorio { max-width: 1080px; margin: 0 auto; padding: 0 20px; }

/* Cabecera */
.cabecera { border-bottom: 1px solid var(--linea); }
.cabecera .envoltorio { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-top: 22px; padding-bottom: 18px; }
.marca { text-decoration: none; display: flex; align-items: center; gap: 14px; }
.marca-texto { display: grid; gap: 2px; }
.divisa { font-family: var(--display); font-weight: 700; font-size: 0.72rem; letter-spacing: 0.32em; text-transform: uppercase; color: var(--tinta-suave); }
.abejas { display: inline-flex; gap: 3px; margin-left: 8px; vertical-align: middle; }
.abejas svg { width: 17px; height: 18px; }
.ala { fill: var(--papel); stroke: var(--tinta); stroke-width: 1.3; }
.cuerpo { fill: var(--tinta); }
.raya { stroke: #e4b528; stroke-width: 1.8; }
.pie .envoltorio { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }

.marca-nombre { font-family: var(--display); font-weight: 800; font-size: 1.6rem; letter-spacing: -0.02em; }
.lema { color: var(--tinta-suave); font-size: 1rem; font-style: italic; margin: 0; }

/* Filtros */
.filtros { display: flex; gap: 8px; flex-wrap: wrap; margin: 28px 0 8px; }
.chip {
  font-family: var(--display); font-weight: 500; font-size: 0.95rem;
  border: 1px solid var(--linea); background: var(--tarjeta); color: var(--tinta);
  padding: 6px 14px; border-radius: 999px; cursor: pointer;
}
.chip:hover { border-color: var(--acento); }
.chip[aria-pressed="true"] { background: var(--acento); border-color: var(--acento); color: var(--papel); }

/* Destacado */
.destacado {
  display: grid; grid-template-columns: 1.1fr 1fr; gap: 32px;
  padding: 32px 0 40px; border-bottom: 1px solid var(--linea); text-decoration: none;
}
.destacado h2 { font-size: clamp(2rem, 4.5vw, 3.2rem); font-weight: 800; letter-spacing: -0.025em; }
.destacado:hover h2 { color: var(--acento); }
.destacado .entradilla { color: var(--tinta-suave); margin: 14px 0 0; max-width: 60ch; }
.trio { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; align-content: start; }
.trio li { display: grid; grid-template-columns: 3.2rem 1fr; gap: 12px; align-items: baseline; padding-bottom: 14px; border-bottom: 1px dashed var(--linea); }
.trio li:last-child { border-bottom: 0; }
.trio .num { font-family: var(--display); font-weight: 800; font-size: 2.4rem; line-height: 1; color: var(--acento); font-variant-numeric: tabular-nums; }
.trio .nom { font-family: var(--display); font-weight: 700; font-size: 1.25rem; }
.trio .sub { display: block; color: var(--tinta-suave); font-size: 0.95rem; font-family: var(--cuerpo); font-weight: 400; }

.meta { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-family: var(--display); font-size: 0.9rem; color: var(--tinta-suave); margin-bottom: 14px; }
.etiqueta { background: var(--acento-suave); color: var(--acento); padding: 2px 10px; border-radius: 999px; font-weight: 700; }

/* Listado */
.seccion-titulo { font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--tinta-suave); margin: 36px 0 16px; font-weight: 700; }
.rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 20px; margin-bottom: 56px; }
.tarjeta {
  display: flex; flex-direction: column; gap: 10px; text-decoration: none;
  background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 10px; padding: 22px;
}
.tarjeta:hover { border-color: var(--acento); }
.tarjeta h3 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.01em; }
.tarjeta .meta { margin: 0; }
.tarjeta .tres { font-size: 0.98rem; color: var(--tinta-suave); margin: 0; }
.tarjeta .tres b { color: var(--acento); font-family: var(--display); }
.vacio { color: var(--tinta-suave); font-style: italic; }

/* Artículo */
.articulo { max-width: 860px; margin: 0 auto; padding: 36px 0 64px; }
.volver { font-family: var(--display); font-size: 0.95rem; color: var(--tinta-suave); text-decoration: none; display: inline-block; margin-bottom: 24px; }
.volver:hover { color: var(--acento); }
.articulo h1 { font-size: clamp(2.2rem, 5.5vw, 3.6rem); font-weight: 800; letter-spacing: -0.03em; }
.articulo .entradilla { font-size: 1.25rem; color: var(--tinta-suave); margin: 18px 0 8px; }
.pieza { display: grid; grid-template-columns: 5.5rem 1fr; gap: 20px; padding: 32px 0; border-top: 1px solid var(--linea); }
.pieza:first-of-type { margin-top: 24px; }
.pieza .num { font-family: var(--display); font-weight: 800; font-size: 5rem; line-height: 0.85; color: var(--acento); }
.pieza h2 { font-size: 1.7rem; font-weight: 700; }
.pieza .sub { font-family: var(--display); color: var(--tinta-suave); font-size: 1rem; margin: 4px 0 12px; }
.pieza p { margin: 0 0 12px; max-width: 65ch; }
.pieza blockquote { margin: 0 0 12px; font-size: 1.45rem; font-style: italic; line-height: 1.45; border-left: 4px solid var(--acento); padding-left: 18px; }
.cierre { border-top: 1px solid var(--linea); padding-top: 24px; font-style: italic; color: var(--tinta-suave); }
.navegacion { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 40px; }
.navegacion a { background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 10px; padding: 16px; text-decoration: none; }
.navegacion a:hover { border-color: var(--acento); }
.navegacion small { display: block; font-family: var(--display); color: var(--tinta-suave); }
.navegacion span { font-family: var(--display); font-weight: 700; }
.navegacion .sig { text-align: right; grid-column: 2; }

.pie { border-top: 1px solid var(--linea); padding: 24px 0 36px; color: var(--tinta-suave); font-size: 0.95rem; }

@media (max-width: 760px) {
  .destacado { grid-template-columns: 1fr; gap: 22px; }
  .pieza { grid-template-columns: 1fr; gap: 8px; }
  .pieza .num { font-size: 3.6rem; }
  .navegacion { grid-template-columns: 1fr; }
  .navegacion .sig { grid-column: 1; }
}
@media (prefers-reduced-motion: no-preference) {
  .chip, .tarjeta, .navegacion a, .destacado h2 { transition: border-color .15s, background .15s, color .15s; }
}

/* Menú de temas */
.temas { border-bottom: 1px solid var(--linea); }
.temas .envoltorio { display: flex; gap: 6px; flex-wrap: wrap; padding-top: 10px; padding-bottom: 10px; }
.tema-enlace { font-family: var(--display); font-weight: 500; font-size: 0.95rem; text-decoration: none; padding: 5px 12px; border-radius: 999px; border: 1px solid transparent; color: var(--tinta-suave); }
.tema-enlace:hover { color: var(--tinta); border-color: var(--linea); }
.tema-enlace[aria-current="page"] { background: var(--acento); color: var(--papel); }
.tema-enlace .cuenta { font-variant-numeric: tabular-nums; opacity: 0.7; margin-left: 4px; font-size: 0.82em; }
.tema-vacio { opacity: 0.55; }

/* Página de tema e índice */
.tema-cabecera { padding: 36px 0 8px; }
.tema-cabecera h1 { font-size: clamp(2.2rem, 5vw, 3.2rem); font-weight: 800; letter-spacing: -0.03em; }
.tema-cabecera p { color: var(--tinta-suave); margin: 10px 0 0; }
.indice { width: 100%; border-collapse: collapse; margin-bottom: 64px; font-size: 1rem; }
.indice th { text-align: left; font-family: var(--display); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--tinta-suave); padding: 0 12px 10px 0; border-bottom: 2px solid var(--tinta); }
.indice td { padding: 14px 12px 14px 0; border-bottom: 1px solid var(--linea); vertical-align: top; }
.indice td:first-child { font-family: var(--display); font-weight: 700; white-space: nowrap; width: 1%; }
.indice .frase { font-style: italic; }
.indice a { color: var(--acento); font-family: var(--display); font-weight: 500; text-decoration: none; }
.indice a:hover { text-decoration: underline; }
.indice-caja { overflow-x: auto; }
.pieza .contexto { color: var(--tinta-suave); }
@media (max-width: 760px) { .indice td:first-child { white-space: normal; } }
.pieza-cuerpo { display: block; }
.pieza-cuerpo.con-cartel { display: grid; grid-template-columns: 1fr 240px; gap: 28px; align-items: start; }
.cartel { width: 100%; border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,.18); display: block; }
.escena { background: var(--acento-suave); border-radius: 8px; padding: 14px 16px; margin: 16px 0 4px; }
.escena p { margin: 0; }
.escena-etiqueta { display: block; font-family: var(--display); font-weight: 700; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--acento); margin-bottom: 4px; }
.foto-escena { margin: 16px 0 0; }
.foto-escena img { max-width: 100%; border-radius: 6px; display: block; }
.foto-escena figcaption { font-family: var(--display); font-size: 0.85rem; color: var(--tinta-suave); margin-top: 6px; }
.video-etiqueta { font-family: var(--display); font-weight: 700; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--acento); margin: 26px 0 -16px; }
.video-marco { position: relative; aspect-ratio: 16 / 9; margin: 28px 0 12px; border-radius: 8px; overflow: hidden; background: #000; }
.video-marco iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.video a { display: inline-block; font-family: var(--display); font-weight: 700; text-decoration: none; background: var(--acento); color: var(--papel); padding: 10px 18px; border-radius: 999px; }
.video a:hover { opacity: .9; }
@media (max-width: 760px) {
  .pieza-cuerpo.con-cartel { grid-template-columns: 1fr; }
  .pieza-cuerpo.con-cartel .cartel { order: -1; width: 200px; }
}
/* Las tres del día */
.con-lateral { display: grid; grid-template-columns: minmax(0, 1fr) 230px; gap: 40px; align-items: start; }
.lateral { position: sticky; top: 16px; padding-top: 4px; }
.lateral .seccion-titulo, .lateral-movil .seccion-titulo { margin-top: 32px; }
.fotos-dia { display: grid; gap: 18px; }
.fotos-dia figure { margin: 0; }
.fotos-dia img { width: 100%; display: block; border-radius: 4px; box-shadow: 0 4px 14px rgba(0,0,0,.16); }
.fotos-dia figcaption { font-family: var(--display); font-size: 0.82rem; line-height: 1.35; color: var(--tinta-suave); margin-top: 6px; }
.fotos-dia figcaption b { display: block; color: var(--tinta); font-weight: 700; }
.fotos-dia figcaption i { display: block; }
.lateral-movil { display: none; }
@media (max-width: 1000px) {
  .con-lateral { grid-template-columns: 1fr; gap: 0; }
  .lateral { display: none; }
  .lateral-movil { display: block; }
  .lateral-movil .fotos-dia { grid-template-columns: repeat(3, 1fr); gap: 10px; align-items: start; }
  .lateral-movil figcaption { font-size: 0.72rem; }
}
.ver-galeria { display: inline-block; margin-top: 14px; font-family: var(--display); font-weight: 700; font-size: 0.9rem; color: var(--acento); text-decoration: none; }
.ver-galeria:hover { text-decoration: underline; }
.galeria-fotos { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; align-items: start; }
@media (max-width: 600px) { .galeria-fotos { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
</head>

   1) DATOS DEL SITIO

/* =====================================================================
   3) A partir de aquí no hace falta tocar nada.
   ===================================================================== */
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const contenido = document.getElementById("contenido");

function esc(t) {
  return String(t == null ? "" : t).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
function parrafos(t) {
  return esc(t).split(/\n\s*\n/).map(p => "<p>" + p.replace(/\n/g, "<br>") + "</p>").join("");
}
function fechaLarga(f) {
  const [a, m, d] = f.split("-").map(Number);
  return d + " de " + MESES[m - 1] + " de " + a;
}
function slug(t) {
  return t.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
}
function ordenados() {
  return ARTICULOS.slice().sort((x, y) => y.fecha.localeCompare(x.fecha));
}
function todosLosTemas() {
  const nombres = TEMAS.map(t => t.nombre);
  ARTICULOS.forEach(a => { if (!nombres.includes(a.categoria)) nombres.push(a.categoria); });
  return nombres;
}
function datosTema(nombre) {
  return TEMAS.find(t => t.nombre === nombre) || { nombre, quien: "Nombre" };
}
function meta(a) {
  return '<div class="meta"><a class="etiqueta" href="#tema-' + slug(a.categoria) + '" style="text-decoration:none">' + esc(a.categoria) + '</a><time datetime="' + esc(a.fecha) + '">' + fechaLarga(a.fecha) + "</time></div>";
}
function tarjeta(a) {
  return '<a class="tarjeta" href="#' + esc(a.id) + '"><div class="meta"><span class="etiqueta">' + esc(a.categoria) + '</span><time>' + fechaLarga(a.fecha) + "</time></div><h3>" + esc(a.titulo) + '</h3><p class="tres">' +
    a.items.map((it, i) => "<b>" + (i + 1) + "</b> " + esc(it.titulo)).join(" &nbsp;·&nbsp; ") + "</p></a>";
}

function videoHtml(v) {
  const id = (v.url.match(/(?:youtu\.be\/|v=)([\w-]{11})/) || [])[1];
  return (id ? '<div class="video-marco"><iframe src="https://www.youtube-nocookie.com/embed/' + id + '" title="' + esc(v.titulo || v.texto || "Vídeo") + '" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe></div>' : "") +
    '<p class="video"><a href="' + esc(v.url) + '" target="_blank" rel="noopener">▶ Ver en YouTube</a></p>';
}

function figuraFoto(f) {
  return '<figure><a href="' + esc(f.imagen) + '" target="_blank" rel="noopener"><img src="' + esc(f.imagen) + '" alt="' + esc([f.obra, f.autor].filter(Boolean).join(", ") || "Foto del día") + '" loading="lazy"></a>' +
    ((f.autor || f.obra) ? "<figcaption>" + (f.autor ? "<b>" + esc(f.autor) + "</b>" : "") + (f.obra ? "<i>" + esc(f.obra) + "</i>" : "") + "</figcaption>" : "") + "</figure>";
}
function fotosDelDia(clase) {
  const hoy = FOTOS_POR_DIA[0];
  if (!hoy) return "";
  return '<aside class="' + clase + '" aria-label="Las tres del día"><h2 class="seccion-titulo">Las tres del día</h2><div class="fotos-dia">' +
    hoy.fotos.map(figuraFoto).join("") + '</div><a class="ver-galeria" href="#galeria">' + (FOTOS_POR_DIA.length > 1 ? "Ver anteriores →" : "Ver galería →") + "</a></aside>";
}
function paginaGaleria() {
  pintarMenu("galeria");
  let h = '<header class="tema-cabecera"><h1>Galería</h1><p>Todas las «tres del día», de la más reciente a la más antigua.</p></header>';
  FOTOS_POR_DIA.forEach((d, i) => {
    h += '<section class="galeria-dia"><h2 class="seccion-titulo">' + fechaLarga(d.fecha) + (i === 0 ? " · hoy en portada" : "") + '</h2><div class="fotos-dia galeria-fotos">' + d.fotos.map(figuraFoto).join("") + "</div></section>";
  });
  contenido.innerHTML = h + '<div style="height:48px"></div>';
  document.title = "Galería · " + SITIO.nombre;
}
function conLateral(principal) {
  return '<div class="con-lateral"><div class="principal">' + principal + "</div>" + fotosDelDia("lateral") + "</div>";
}

function pintarMenu(actual) {
  const menu = document.getElementById("menu-temas");
  menu.innerHTML = '<a class="tema-enlace" href="#"' + (actual === "" ? ' aria-current="page"' : "") + ">Inicio</a>" +
    todosLosTemas().map(n => {
      const c = ARTICULOS.filter(a => a.categoria === n).length;
      return '<a class="tema-enlace' + (c ? "" : " tema-vacio") + '" href="#tema-' + slug(n) + '"' + (actual === slug(n) ? ' aria-current="page"' : "") + ">" + esc(n) + (c ? '<span class="cuenta">' + c + "</span>" : "") + "</a>";
    }).join("") +
    '<a class="tema-enlace" href="#galeria"' + (actual === "galeria" ? ' aria-current="page"' : "") + ">Galería</a>";
}

function portada() {
  const lista = ordenados();
  pintarMenu("");
  if (!lista.length) { contenido.innerHTML = '<p class="vacio" style="padding:40px 0">Muy pronto, el primer artículo.</p>'; return; }
  const [primero, ...resto] = lista;
  let h = '<a class="destacado" href="#' + esc(primero.id) + '"><div>' + '<div class="meta"><span class="etiqueta">' + esc(primero.categoria) + '</span><time>' + fechaLarga(primero.fecha) + "</time></div>" +
    "<h2>" + esc(primero.titulo) + "</h2>" + (primero.entradilla ? '<p class="entradilla">' + esc(primero.entradilla) + "</p>" : "") + "</div>" +
    '<ol class="trio">' + primero.items.map((it, i) =>
      '<li><span class="num">' + (i + 1) + '</span><span class="nom">' + esc(it.titulo) + '<span class="sub">' + esc(it.cita ? "«" + it.cita + "»" : it.subtitulo) + "</span></span></li>").join("") +
    "</ol></a>";
  h += fotosDelDia("lateral-movil");
  h += resto.length ? '<h2 class="seccion-titulo">Anteriores</h2><div class="rejilla">' + resto.map(tarjeta).join("") + "</div>" : '<div style="height:48px"></div>';
  contenido.innerHTML = conLateral(h);
  document.title = SITIO.nombre;
}

function paginaTema(nombre) {
  const t = datosTema(nombre);
  const lista = ordenados().filter(a => a.categoria === nombre);
  pintarMenu(slug(nombre));
  let h = '<header class="tema-cabecera"><h1>' + esc(nombre) + "</h1><p>" +
    (lista.length ? lista.length + (lista.length === 1 ? " artículo" : " artículos") + " · " + lista.length * 3 + " piezas" : "Todavía no hay artículos en este tema.") + "</p></header>";
  if (lista.length) {
    h += '<h2 class="seccion-titulo">Artículos</h2><div class="rejilla">' + lista.map(tarjeta).join("") + "</div>";
    const filas = [];
    lista.forEach(a => a.items.forEach(it => filas.push({ it, a })));
    filas.sort((x, y) => x.it.titulo.localeCompare(y.it.titulo, "es"));
    const esFrases = filas.some(f => f.it.cita);
    h += '<h2 class="seccion-titulo">Índice de ' + esc(nombre.toLowerCase()) + '</h2><div class="indice-caja"><table class="indice"><thead><tr><th scope="col">' + esc(t.quien) + "</th><th scope=\"col\">" + (esFrases ? "Frase" : "Detalle") + '</th><th scope="col">Publicada en</th></tr></thead><tbody>' +
      filas.map(f => "<tr><td>" + esc(f.it.titulo) + "</td><td" + (f.it.cita ? ' class="frase">«' + esc(f.it.cita) + "»" : ">" + esc(f.it.subtitulo)) + '</td><td><a href="#' + esc(f.a.id) + '">' + esc(f.a.titulo) + "</a><br><small>" + fechaLarga(f.a.fecha) + "</small></td></tr>").join("") +
      "</tbody></table></div>";
  }
  h += fotosDelDia("lateral-movil");
  contenido.innerHTML = conLateral(h);
  document.title = nombre + " · " + SITIO.nombre;
}

function articulo(a) {
  const todos = ordenados();
  const i = todos.indexOf(a);
  const anterior = todos[i + 1], siguiente = todos[i - 1];
  pintarMenu(slug(a.categoria));
  let h = '<article class="articulo"><a class="volver" href="#tema-' + slug(a.categoria) + '">← Todo en ' + esc(a.categoria) + "</a>" + meta(a) +
    "<h1>" + esc(a.titulo) + "</h1>" + (a.entradilla ? '<p class="entradilla">' + esc(a.entradilla) + "</p>" : "");
  a.items.forEach((it, n) => {
    h += '<section class="pieza"><div class="num" aria-hidden="true">' + (n + 1) + '</div><div class="pieza-cuerpo' + (it.imagen ? " con-cartel" : "") + '"><div><h2>' + esc(it.titulo) + "</h2>" +
      (it.subtitulo ? '<div class="sub">' + esc(it.subtitulo) + "</div>" : "") +
      (it.contexto ? '<div class="contexto">' + parrafos(it.contexto) + "</div>" : "") +
      (it.cita ? "<blockquote>«" + esc(it.cita) + "»</blockquote>" : "") +
      (it.texto ? parrafos(it.texto) : "") +
      (it.escena ? '<div class="escena"><span class="escena-etiqueta">La escena</span>' + parrafos(it.escena) + "</div>" : "") +
      (it.escenaImagen ? '<figure class="foto-escena"><img src="' + esc(it.escenaImagen) + '" alt="' + esc(it.escenaPie || it.titulo) + '" loading="lazy">' + (it.escenaPie ? "<figcaption>" + esc(it.escenaPie) + "</figcaption>" : "") + "</figure>" : "") +
      (it.video ? '<div class="escena"><span class="escena-etiqueta">' + esc(it.video.titulo || "Vídeo") + "</span>" + (it.video.texto ? parrafos(it.video.texto) : "") + "</div>" + videoHtml(it.video) : "") +
      (it.videos ? it.videos.map(v => '<p class="video-etiqueta">' + esc(v.titulo || "Vídeo") + "</p>" + videoHtml(v)).join("") : "") +
      "</div>" + (it.imagen ? '<img class="cartel" src="' + esc(it.imagen) + '" alt="' + esc(it.titulo) + '" loading="lazy">' : "") + "</div></section>";
  });
  if (a.cierre) h += '<p class="cierre">' + esc(a.cierre) + "</p>";
  if (a.video) {
    const vid = (a.video.url.match(/(?:youtu\.be\/|v=)([\w-]{11})/) || [])[1];
    if (vid) h += '<div class="video-marco"><iframe src="https://www.youtube-nocookie.com/embed/' + vid + '" title="' + esc(a.video.texto || "Vídeo") + '" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe></div>';
    h += '<p class="video"><a href="' + esc(a.video.url) + '" target="_blank" rel="noopener">▶ ' + esc(a.video.texto || "Ver el vídeo en YouTube") + "</a></p>";
  }
  h += '<nav class="navegacion" aria-label="Más artículos">' +
    (anterior ? '<a href="#' + esc(anterior.id) + '"><small>← Anterior</small><span>' + esc(anterior.titulo) + "</span></a>" : "") +
    (siguiente ? '<a class="sig" href="#' + esc(siguiente.id) + '"><small>Siguiente →</small><span>' + esc(siguiente.titulo) + "</span></a>" : "") +
    "</nav></article>";
  contenido.innerHTML = h;
  document.title = a.titulo + " · " + SITIO.nombre;
}

function mostrar() {
  const id = decodeURIComponent(location.hash.slice(1));
  const a = ARTICULOS.find(x => x.id === id);
  const tema = id.startsWith("tema-") ? todosLosTemas().find(n => "tema-" + slug(n) === id) : null;
  if (a) articulo(a); else if (tema) paginaTema(tema); else if (id === "galeria") paginaGaleria(); else portada();
  window.scrollTo(0, 0);
}

document.getElementById("nombre-sitio").textContent = SITIO.nombre;
document.getElementById("lema-sitio").textContent = SITIO.lema;
document.getElementById("pie-texto").textContent = "© " + new Date().getFullYear() + " " + SITIO.nombre + " · Circum longe · Omnia tria perfecta sunt.";
window.addEventListener("hashchange", mostrar);
mostrar();

/* Estadísticas de visitas (GoatCounter): cuenta cada artículo y cada tema por separado. */
function contarVisita() {
  if (!window.goatcounter || !window.goatcounter.count) return;
  const ruta = location.hash.length > 1 ? "/" + decodeURIComponent(location.hash.slice(1)) : "/";
  window.goatcounter.count({ path: ruta, title: document.title });
}
window.addEventListener("hashchange", contarVisita);
</script>
<script data-goatcounter="https://omniatria.goatcounter.com/count"
        data-goatcounter-settings='{"no_onload": true}'
        async src="https://gc.zgo.at/count.js" onload="contarVisita()"></script>
