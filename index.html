<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omnia Tria</title>
<meta name="description" content="Cada día, tres cosas que me gustan: películas, frases, historias y lo que vaya saliendo.">
<link rel="icon" href="abeja.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
/* Idea: un cuaderno editorial; cada artículo son tres piezas numeradas 1·2·3 en grande. */
:root {
  --papel: #f3f4ef;
  --tarjeta: #ffffff;
  --tinta: #17191e;
  --tinta-suave: #5a5f6a;
  --linea: #d9dbd3;
  --acento: #2b45c9;
  --acento-suave: #e3e7fa;
  --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --cuerpo: "Source Serif 4", Georgia, "Times New Roman", serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papel: #121419;
    --tarjeta: #1b1e25;
    --tinta: #eceef2;
    --tinta-suave: #a2a8b5;
    --linea: #2c313b;
    --acento: #8ea0ff;
    --acento-suave: #232a47;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --papel: #121419;
  --tarjeta: #1b1e25;
  --tinta: #eceef2;
  --tinta-suave: #a2a8b5;
  --linea: #2c313b;
  --acento: #8ea0ff;
  --acento-suave: #232a47;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--papel);
  color: var(--tinta);
  font-family: var(--cuerpo);
  font-size: 1.125rem;
  line-height: 1.6;
}
a { color: inherit; }
a:focus-visible, button:focus-visible { outline: 3px solid var(--acento); outline-offset: 3px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.1; text-wrap: balance; margin: 0; }

.envoltorio { max-width: 1080px; margin: 0 auto; padding: 0 20px; }

/* Cabecera */
.cabecera { border-bottom: 1px solid var(--linea); }
.cabecera .envoltorio { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-top: 22px; padding-bottom: 18px; }
.marca { text-decoration: none; display: flex; align-items: center; gap: 14px; }
.marca-texto { display: grid; gap: 2px; }
.divisa { font-family: var(--display); font-weight: 700; font-size: 0.72rem; letter-spacing: 0.32em; text-transform: uppercase; color: var(--tinta-suave); }
.abejas { display: inline-flex; gap: 3px; margin-left: 8px; vertical-align: middle; }
.abejas svg { width: 17px; height: 18px; }
.ala { fill: var(--papel); stroke: var(--tinta); stroke-width: 1.3; }
.cuerpo { fill: var(--tinta); }
.raya { stroke: #e4b528; stroke-width: 1.8; }
.pie .envoltorio { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }

.marca-nombre { font-family: var(--display); font-weight: 800; font-size: 1.6rem; letter-spacing: -0.02em; }
.lema { color: var(--tinta-suave); font-size: 1rem; font-style: italic; margin: 0; }

/* Filtros */
.filtros { display: flex; gap: 8px; flex-wrap: wrap; margin: 28px 0 8px; }
.chip {
  font-family: var(--display); font-weight: 500; font-size: 0.95rem;
  border: 1px solid var(--linea); background: var(--tarjeta); color: var(--tinta);
  padding: 6px 14px; border-radius: 999px; cursor: pointer;
}
.chip:hover { border-color: var(--acento); }
.chip[aria-pressed="true"] { background: var(--acento); border-color: var(--acento); color: var(--papel); }

/* Destacado */
.destacado {
  display: grid; grid-template-columns: 1.1fr 1fr; gap: 32px;
  padding: 32px 0 40px; border-bottom: 1px solid var(--linea); text-decoration: none;
}
.destacado h2 { font-size: clamp(2rem, 4.5vw, 3.2rem); font-weight: 800; letter-spacing: -0.025em; }
.destacado:hover h2 { color: var(--acento); }
.destacado .entradilla { color: var(--tinta-suave); margin: 14px 0 0; max-width: 60ch; }
.trio { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; align-content: start; }
.trio li { display: grid; grid-template-columns: 3.2rem 1fr; gap: 12px; align-items: baseline; padding-bottom: 14px; border-bottom: 1px dashed var(--linea); }
.trio li:last-child { border-bottom: 0; }
.trio .num { font-family: var(--display); font-weight: 800; font-size: 2.4rem; line-height: 1; color: var(--acento); font-variant-numeric: tabular-nums; }
.trio .nom { font-family: var(--display); font-weight: 700; font-size: 1.25rem; }
.trio .sub { display: block; color: var(--tinta-suave); font-size: 0.95rem; font-family: var(--cuerpo); font-weight: 400; }

.meta { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-family: var(--display); font-size: 0.9rem; color: var(--tinta-suave); margin-bottom: 14px; }
.etiqueta { background: var(--acento-suave); color: var(--acento); padding: 2px 10px; border-radius: 999px; font-weight: 700; }

/* Listado */
.seccion-titulo { font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--tinta-suave); margin: 36px 0 16px; font-weight: 700; }
.rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 20px; margin-bottom: 56px; }
.tarjeta {
  display: flex; flex-direction: column; gap: 10px; text-decoration: none;
  background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 10px; padding: 22px;
}
.tarjeta:hover { border-color: var(--acento); }
.tarjeta h3 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.01em; }
.tarjeta .meta { margin: 0; }
.tarjeta .tres { font-size: 0.98rem; color: var(--tinta-suave); margin: 0; }
.tarjeta .tres b { color: var(--acento); font-family: var(--display); }
.vacio { color: var(--tinta-suave); font-style: italic; }

/* Artículo */
.articulo { max-width: 760px; margin: 0 auto; padding: 36px 0 64px; }
.volver { font-family: var(--display); font-size: 0.95rem; color: var(--tinta-suave); text-decoration: none; display: inline-block; margin-bottom: 24px; }
.volver:hover { color: var(--acento); }
.articulo h1 { font-size: clamp(2.2rem, 5.5vw, 3.6rem); font-weight: 800; letter-spacing: -0.03em; }
.articulo .entradilla { font-size: 1.25rem; color: var(--tinta-suave); margin: 18px 0 8px; }
.pieza { display: grid; grid-template-columns: 5.5rem 1fr; gap: 20px; padding: 32px 0; border-top: 1px solid var(--linea); }
.pieza:first-of-type { margin-top: 24px; }
.pieza .num { font-family: var(--display); font-weight: 800; font-size: 5rem; line-height: 0.85; color: var(--acento); }
.pieza h2 { font-size: 1.7rem; font-weight: 700; }
.pieza .sub { font-family: var(--display); color: var(--tinta-suave); font-size: 1rem; margin: 4px 0 12px; }
.pieza p { margin: 0 0 12px; max-width: 65ch; }
.pieza blockquote { margin: 0 0 12px; font-size: 1.45rem; font-style: italic; line-height: 1.45; border-left: 4px solid var(--acento); padding-left: 18px; }
.cierre { border-top: 1px solid var(--linea); padding-top: 24px; font-style: italic; color: var(--tinta-suave); }
.navegacion { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 40px; }
.navegacion a { background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 10px; padding: 16px; text-decoration: none; }
.navegacion a:hover { border-color: var(--acento); }
.navegacion small { display: block; font-family: var(--display); color: var(--tinta-suave); }
.navegacion span { font-family: var(--display); font-weight: 700; }
.navegacion .sig { text-align: right; grid-column: 2; }

.pie { border-top: 1px solid var(--linea); padding: 24px 0 36px; color: var(--tinta-suave); font-size: 0.95rem; }

@media (max-width: 760px) {
  .destacado { grid-template-columns: 1fr; gap: 22px; }
  .pieza { grid-template-columns: 1fr; gap: 8px; }
  .pieza .num { font-size: 3.6rem; }
  .navegacion { grid-template-columns: 1fr; }
  .navegacion .sig { grid-column: 1; }
}
@media (prefers-reduced-motion: no-preference) {
  .chip, .tarjeta, .navegacion a, .destacado h2 { transition: border-color .15s, background .15s, color .15s; }
}
</style>
</head>
<body>

<header class="cabecera">
  <div class="envoltorio">
    <a class="marca" href="#" id="enlace-inicio"><span class="marca-texto"><span class="marca-nombre"><span id="nombre-sitio">Omnia Tria</span><span class="abejas"><svg viewBox="-12 -14 24 26" aria-hidden="true"><ellipse cx="-5.5" cy="-5" rx="4.5" ry="6.5" transform="rotate(-35 -5.5 -5)" class="ala"/><ellipse cx="5.5" cy="-5" rx="4.5" ry="6.5" transform="rotate(35 5.5 -5)" class="ala"/><ellipse cx="0" cy="3" rx="5.2" ry="8.5" class="cuerpo"/><path d="M-5 1 H5 M-4.6 5.5 H4.6" class="raya"/><circle cx="0" cy="-7" r="3.4" class="cuerpo"/></svg><svg viewBox="-12 -14 24 26" aria-hidden="true"><ellipse cx="-5.5" cy="-5" rx="4.5" ry="6.5" transform="rotate(-35 -5.5 -5)" class="ala"/><ellipse cx="5.5" cy="-5" rx="4.5" ry="6.5" transform="rotate(35 5.5 -5)" class="ala"/><ellipse cx="0" cy="3" rx="5.2" ry="8.5" class="cuerpo"/><path d="M-5 1 H5 M-4.6 5.5 H4.6" class="raya"/><circle cx="0" cy="-7" r="3.4" class="cuerpo"/></svg><svg viewBox="-12 -14 24 26" aria-hidden="true"><ellipse cx="-5.5" cy="-5" rx="4.5" ry="6.5" transform="rotate(-35 -5.5 -5)" class="ala"/><ellipse cx="5.5" cy="-5" rx="4.5" ry="6.5" transform="rotate(35 5.5 -5)" class="ala"/><ellipse cx="0" cy="3" rx="5.2" ry="8.5" class="cuerpo"/><path d="M-5 1 H5 M-4.6 5.5 H4.6" class="raya"/><circle cx="0" cy="-7" r="3.4" class="cuerpo"/></svg></span></span><span class="divisa">Circum longe</span></span></a>
    <p class="lema" id="lema-sitio"></p>
  </div>
</header>

<main class="envoltorio" id="contenido"></main>

<footer class="pie">
  <div class="envoltorio"><span id="pie-texto"></span></div>
</footer>

<script>
/* =====================================================================
   1) DATOS DEL SITIO: cambia aquí el nombre, el lema y tu nombre.
   ===================================================================== */
const SITIO = {
  nombre: "Omnia Tria",
  lema: "Cada día, tres cosas que me gustan.",
  autor: "Tu nombre"
};

/* =====================================================================
   2) ARTÍCULOS: para publicar uno nuevo, copia la PLANTILLA de abajo,
      pégala al principio de la lista y rellénala. El más nuevo arriba.

   PLANTILLA:
   {
     id: "3-cosas-de-ejemplo",          // solo letras, números y guiones, sin tildes
     fecha: "2026-11-19",               // año-mes-día
     categoria: "Películas",            // Películas, Frases, Historias, Libros, Música...
     titulo: "3 cosas de ejemplo",
     entradilla: "Una o dos frases para presentar el artículo.",
     items: [
       { titulo: "Primera", subtitulo: "Dato breve", texto: "Por qué me gusta." },
       { titulo: "Segunda", subtitulo: "Dato breve", texto: "Por qué me gusta." },
       { titulo: "Tercera", subtitulo: "Dato breve", texto: "Por qué me gusta." }
     ],
     cierre: "Una frase final (opcional)."
   },

   En las frases, pon la cita en "cita" en vez de (o además de) "texto":
     { titulo: "Séneca", subtitulo: "Cartas a Lucilio", cita: "La frase...", texto: "Comentario." }
   ===================================================================== */
const ARTICULOS = [
  {
    id: "3-inventos-por-accidente",
    fecha: "2026-11-18",
    categoria: "Historias",
    titulo: "3 inventos que nacieron por accidente",
    entradilla: "Nadie los estaba buscando. Alguien se fijó en lo que había salido mal y vio que, en realidad, había salido muy bien.",
    items: [
      { titulo: "La penicilina", subtitulo: "Londres, 1928",
        texto: "Alexander Fleming volvió de vacaciones y encontró una de sus placas de cultivo contaminada por un moho. Alrededor del moho, las bacterias habían desaparecido. En lugar de tirar la placa, la estudió. Años después, la penicilina salvaría millones de vidas." },
      { titulo: "El microondas", subtitulo: "Estados Unidos, 1945",
        texto: "Percy Spencer trabajaba con magnetrones para radares cuando notó que la chocolatina que llevaba en el bolsillo se había derretido. Probó con maíz y salieron palomitas. Así empezó el horno que hoy está en casi todas las cocinas." },
      { titulo: "El pósit", subtitulo: "3M, 1968 y 1974",
        texto: "Spencer Silver buscaba un pegamento muy fuerte y le salió uno flojísimo, que pegaba y se despegaba sin dejar marca. Nadie supo qué hacer con él hasta que su compañero Art Fry lo usó para que no se le cayeran los marcapáginas del cancionero del coro." }
    ],
    cierre: "Los tres tienen algo en común: alguien que, ante un fallo, preguntó por qué en lugar de limpiar y seguir."
  },
  {
    id: "3-frases-de-seneca",
    fecha: "2026-11-17",
    categoria: "Frases",
    titulo: "3 frases de Séneca para empezar la semana",
    entradilla: "Escribió hace casi dos mil años y sigue sonando a consejo de un amigo sensato.",
    items: [
      { titulo: "Sobre el tiempo", subtitulo: "De la brevedad de la vida",
        cita: "No es que tengamos poco tiempo, sino que perdemos mucho.",
        texto: "La idea central de todo el libro: la vida es suficientemente larga si se usa bien." },
      { titulo: "Sobre aplazar", subtitulo: "Cartas a Lucilio",
        cita: "Mientras se aplaza, la vida pasa.",
        texto: "Ideal para pegar en la nevera un lunes por la mañana." },
      { titulo: "Sobre las preocupaciones", subtitulo: "Cartas a Lucilio",
        cita: "Sufrimos más a menudo en la imaginación que en la realidad.",
        texto: "La mayoría de lo que nos quita el sueño nunca llega a pasar." }
    ],
    cierre: "Tres frases cortas para una semana larga."
  },
  {
    id: "3-peliculas-tarde-de-lluvia",
    fecha: "2026-11-16",
    categoria: "Películas",
    titulo: "3 películas para una tarde de lluvia",
    entradilla: "Manta, sofá y algo que te deje mejor de lo que estabas.",
    items: [
      { titulo: "Cantando bajo la lluvia", subtitulo: "Stanley Donen y Gene Kelly, 1952",
        texto: "La transición del cine mudo al sonoro contada con números musicales que no envejecen. Y sí, tiene la escena de bailar bajo la lluvia más famosa de la historia." },
      { titulo: "El viaje de Chihiro", subtitulo: "Hayao Miyazaki, 2001",
        texto: "Una niña atrapada en un balneario de espíritus. Es imaginativa, rara y emocionante, y cada vez que la ves descubres un detalle nuevo en el fondo de la imagen." },
      { titulo: "Atrapado en el tiempo", subtitulo: "Harold Ramis, 1993",
        texto: "Un meteorólogo antipático vive el mismo día una y otra vez. Empieza como comedia y termina siendo una pequeña lección sobre cómo aprovechar cada día." }
    ],
    cierre: "Si solo te da tiempo a una, que sea la que menos conozcas."
  }
];

/* =====================================================================
   3) A partir de aquí no hace falta tocar nada.
   ===================================================================== */
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const contenido = document.getElementById("contenido");
let filtro = "Todas";

function esc(t) {
  return String(t == null ? "" : t).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
function parrafos(t) {
  return esc(t).split(/\n\s*\n/).map(p => "<p>" + p.replace(/\n/g, "<br>") + "</p>").join("");
}
function fechaLarga(f) {
  const [a, m, d] = f.split("-").map(Number);
  return d + " de " + MESES[m - 1] + " de " + a;
}
function ordenados() {
  return ARTICULOS.slice().sort((x, y) => y.fecha.localeCompare(x.fecha));
}
function meta(a) {
  return '<div class="meta"><span class="etiqueta">' + esc(a.categoria) + '</span><time datetime="' + esc(a.fecha) + '">' + fechaLarga(a.fecha) + "</time></div>";
}

function portada() {
  const todos = ordenados();
  const categorias = ["Todas", ...new Set(todos.map(a => a.categoria))];
  const lista = filtro === "Todas" ? todos : todos.filter(a => a.categoria === filtro);
  let h = '<div class="filtros" role="group" aria-label="Filtrar por tema">' +
    categorias.map(c => '<button class="chip" type="button" data-cat="' + esc(c) + '" aria-pressed="' + (c === filtro) + '">' + esc(c) + "</button>").join("") +
    "</div>";

  if (!lista.length) {
    contenido.innerHTML = h + '<p class="vacio">Todavía no hay artículos en este tema.</p>';
  } else {
    const [primero, ...resto] = lista;
    h += '<a class="destacado" href="#' + esc(primero.id) + '"><div>' + meta(primero) +
      "<h2>" + esc(primero.titulo) + '</h2><p class="entradilla">' + esc(primero.entradilla) + "</p></div>" +
      '<ol class="trio">' + primero.items.map((it, i) =>
        '<li><span class="num">' + (i + 1) + '</span><span class="nom">' + esc(it.titulo) + '<span class="sub">' + esc(it.subtitulo) + "</span></span></li>").join("") +
      "</ol></a>";
    if (resto.length) {
      h += '<h2 class="seccion-titulo">Anteriores</h2><div class="rejilla">' +
        resto.map(a => '<a class="tarjeta" href="#' + esc(a.id) + '">' + meta(a) + "<h3>" + esc(a.titulo) + '</h3><p class="tres">' +
          a.items.map((it, i) => "<b>" + (i + 1) + "</b> " + esc(it.titulo)).join(" &nbsp;·&nbsp; ") + "</p></a>").join("") +
        "</div>";
    } else {
      h += '<div style="height:48px"></div>';
    }
    contenido.innerHTML = h;
  }
  contenido.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => { filtro = b.dataset.cat; portada(); }));
  document.title = SITIO.nombre;
}

function articulo(a) {
  const todos = ordenados();
  const i = todos.indexOf(a);
  const anterior = todos[i + 1], siguiente = todos[i - 1];
  let h = '<article class="articulo"><a class="volver" href="#">← Todos los artículos</a>' + meta(a) +
    "<h1>" + esc(a.titulo) + "</h1>" + (a.entradilla ? '<p class="entradilla">' + esc(a.entradilla) + "</p>" : "");
  a.items.forEach((it, n) => {
    h += '<section class="pieza"><div class="num" aria-hidden="true">' + (n + 1) + "</div><div><h2>" + esc(it.titulo) + "</h2>" +
      (it.subtitulo ? '<div class="sub">' + esc(it.subtitulo) + "</div>" : "") +
      (it.cita ? "<blockquote>«" + esc(it.cita) + "»</blockquote>" : "") +
      (it.texto ? parrafos(it.texto) : "") + "</div></section>";
  });
  if (a.cierre) h += '<p class="cierre">' + esc(a.cierre) + "</p>";
  h += '<nav class="navegacion" aria-label="Más artículos">' +
    (anterior ? '<a href="#' + esc(anterior.id) + '"><small>← Anterior</small><span>' + esc(anterior.titulo) + "</span></a>" : "") +
    (siguiente ? '<a class="sig" href="#' + esc(siguiente.id) + '"><small>Siguiente →</small><span>' + esc(siguiente.titulo) + "</span></a>" : "") +
    "</nav></article>";
  contenido.innerHTML = h;
  document.title = a.titulo + " · " + SITIO.nombre;
}

function mostrar() {
  const id = decodeURIComponent(location.hash.slice(1));
  const a = ARTICULOS.find(x => x.id === id);
  if (a) articulo(a); else portada();
  window.scrollTo(0, 0);
}

document.getElementById("nombre-sitio").textContent = SITIO.nombre;
document.getElementById("lema-sitio").textContent = SITIO.lema;
document.getElementById("pie-texto").textContent = "© " + new Date().getFullYear() + " " + SITIO.autor + " · " + SITIO.nombre + ". Circum longe.";
window.addEventListener("hashchange", mostrar);
mostrar();
</script>
</body>
</html>
